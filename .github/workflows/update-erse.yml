# Weekly ERSE data refresh
#
# Downloads ERSE's CSVs with plain fetch (scripts/download-erse.js), builds offers.json, checks the
# data bounds against the last commit (scripts/validate-data.js), runs the gate and the smoke test
# (tests/smoke.mjs, Playwright installed outside the repo for the run), and pushes to main only when the CSVs or offers.json changed. meta.json alone never counts:
# its build time changes on every run.
#
# On any failure nothing is pushed, the data files are kept as an artifact, and one issue
# "ERSE data refresh failed" is opened (or commented on, if it is already open) with the log tail.
#
# Schedule: every Monday at 09:00 UTC. Manual trigger: Actions tab, "Update ERSE Data", "Run workflow".

name: Update ERSE Data

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-erse
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the refreshed data to main
      issues: write # open the failure issue
      pages: write # request a Pages build after the push

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download ERSE CSVs
        run: node scripts/download-erse.js 2>&1 | tee -a refresh.log

      - name: Build offers.json
        run: node scripts/build-offers.js 2>&1 | tee -a refresh.log

      - name: Check data bounds
        run: node scripts/validate-data.js 2>&1 | tee -a refresh.log

      - name: Run self-tests
        run: node scripts/selftest.js 2>&1 | tee -a refresh.log

      # Pushes made with GITHUB_TOKEN start no CI run, so the new data meets the page flows here
      - name: Install Playwright and Chromium
        env:
          PLAYWRIGHT_VERSION: 1.62.1
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Run the smoke test on the new data
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node tests/smoke.mjs http://localhost:8000 2>&1 | tee -a refresh.log

      # A stale TAR year gets its own issue and does not block the prices (ADR-009)
      - name: Check the TAR year
        id: tar
        continue-on-error: true
        run: node scripts/validate-data.js --tar-year 2>&1 | tee tar.log

      - name: Open the TAR issue
        if: steps.tar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Update data/tar.json for $(date -u +%Y)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file tar.log
          fi

      # A supplier code with no name gets its own issue and does not block the prices: the page lists
      # it under its ERSE code until js/config.js PROVIDERS names it
      - name: Check supplier names
        id: names
        continue-on-error: true
        run: node scripts/validate-data.js --supplier-names 2>&1 | tee names.log

      - name: Open the supplier names issue
        if: steps.names.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Name the new supplier codes"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file names.log
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/Precos_ELEGN.csv data/CondComerciais.csv data/offers.json; then
            echo "No change in the CSVs or offers.json"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short data/
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # New prices get a new service-worker cache (sw.js VERSION = the price date, ADR-023)
          version=$(node -p "require('./data/meta.json').build.sourceUpdatedAt.slice(0, 10)")
          sed -i "s/^const VERSION = '.*';/const VERSION = '${version}';/" sw.js
          # sed changes nothing when the line has another shape: stop before pushing a stale cache
          grep -q "^const VERSION = '${version}';$" sw.js || { echo "sw.js: no \"const VERSION = '...';\" line to set to ${version}"; exit 1; }
          git add data/offers.json data/meta.json data/Precos_ELEGN.csv data/CondComerciais.csv sw.js
          git commit -m "update erse data $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own
      - name: Request a Pages build
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Keep the data and log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erse-refresh-${{ github.run_id }}
          path: |
            data/
            refresh.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="ERSE data refresh failed"
          {
            echo "The weekly refresh failed on $(date -u +%Y-%m-%d). Nothing was pushed; the site keeps the last good data."
            echo
            echo "Run: ${RUN_URL} (the data files and log are attached as an artifact)."
            echo
            echo "Common causes:"
            echo "- A new supplier code: name it in \`js/config.js\` PROVIDERS (ERSE publishes codes, never names)."
            echo "- \`sw.js\` lost its \`const VERSION = '...';\` line, which the commit step sets to the price date."
            echo "- ERSE changed Settings.json, the ZIP or a CSV column: see \`scripts/download-erse.js\` and \`scripts/build-offers.js\`."
            echo "- The smoke test failed on the new data: the log names the flow and the width (\`tests/smoke.mjs\`)."
            echo "- A bound in \`scripts/validate-data.js\` was breached: the log says which. If the change is real (a supplier left, prices moved), run the refresh locally, check the numbers and commit it by hand."
            echo
            echo "Last 60 lines of the log:"
            echo
            echo '```'
            tail -n 60 refresh.log 2>/dev/null || echo "(no log: the job failed before the download)"
            echo '```'
          } > issue.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md
          fi
